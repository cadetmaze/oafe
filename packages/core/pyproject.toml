[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "datacurate-core"
version = "0.1.0"
description = "Shared models, HF client, DB, blob, queue, thumbnail and search logic for the dataset curation platform"
requires-python = ">=3.10"
dependencies = [
  "psycopg[binary]>=3.1",
  "psycopg-pool>=3.2",
  "requests>=2.31",
  "Pillow>=10.0",
  "numpy>=1.26",
  "pyarrow>=15.0",
  "azure-storage-blob>=12.19",
  "pydantic>=2.6",
  "openai>=1.40",
]

[tool.setuptools.packages.find]
include = ["datacurate_core*"]
